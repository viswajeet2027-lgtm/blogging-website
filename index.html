<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">

            <div class="logo">
                BlogSpace
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="create.html">Create Blog</a></li>
                <li><a href="#">About</a></li>
            </ul>

            <button id="themeBtn">🌙</button>

        </nav>
    </header>


    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">

            <h1>Share Your Thoughts.</h1>

            <p>
                Read interesting stories, share your ideas
                and discover something new.
            </p>

            <a href="blogs.html" class="hero-btn">
                Explore Blogs
            </a>

        </div>

    </section>


    <!-- Latest Blogs -->
    <section class="latest">

        <h2>Latest Blogs</h2>

        <div id="blogContainer" class="blog-container">

            <!-- Blogs will be loaded using JavaScript -->

        </div>

        <div class="view-all">

            <a
                href="blogs.html"
                class="hero-btn"
            >
                View All Blogs →
            </a>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>© 2026 BlogSpace | Created as a student project</p>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
