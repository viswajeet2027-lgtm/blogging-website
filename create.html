<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Blog - BlogSpace</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <div class="logo">
                BlogSpace
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="blogs.html">
                        Blogs
                    </a>
                </li>

                <li>
                    <a href="create.html">
                        Create Blog
                    </a>
                </li>

                <li>
                    <a href="#">
                        About
                    </a>
                </li>

            </ul>

            <button id="themeBtn">
                🌙
            </button>

        </nav>

    </header>


    <!-- Create Blog -->

    <main class="create-container">

        <h1>Create Your Blog</h1>

        <p class="create-description">
            Share your thoughts and ideas with the BlogSpace community.
        </p>


        <form id="blogForm">

            <!-- Title -->

            <label for="title">
                Blog Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter your blog title"
                required
            >


            <!-- Author -->

            <label for="author">
                Author Name
            </label>

            <input
                type="text"
                id="author"
                placeholder="Enter your name"
                required
            >


            <!-- Category -->

            <label for="category">
                Category
            </label>

            <select id="category" required>

                <option value="">
                    Select Category
                </option>

                <option value="Programming">
                    Programming
                </option>

                <option value="Technology">
                    Technology
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Lifestyle">
                    Lifestyle
                </option>

                <option value="Education">
                    Education
                </option>

            </select>


            <!-- Image -->

            <label for="image">
                Image URL
            </label>

            <input
                type="url"
                id="image"
                placeholder="https://example.com/image.jpg"
                required
            >


            <!-- Description -->

            <label for="description">
                Blog Content
            </label>

            <textarea
                id="description"
                rows="10"
                placeholder="Write your blog here..."
                required
            ></textarea>


            <!-- Video -->

            <label for="video">
                YouTube Video URL (Optional)
            </label>

            <input
                type="url"
                id="video"
                placeholder="https://www.youtube.com/watch?v=..."
            >


            <button
                type="submit"
                class="publish-btn"
            >
                Publish Blog
            </button>

        </form>


        <p id="message"></p>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 BlogSpace | Created as a student project
        </p>

    </footer>


    <script src="js/create.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
